name: Materialize Foundation MCP v0.3 once
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize and verify v0.3 source
        shell: bash
        run: |
          set -euo pipefail
          STAGE_COMMIT=b47fc1a39e2c81fd43109f5aca93c74c9512424b
          mkdir -p /tmp/foundation-stage
          git fetch origin automation/foundation-v0.3-stage
          for part in $(git ls-tree -r --name-only "$STAGE_COMMIT" .foundation-staging | sort); do
            git show "$STAGE_COMMIT:$part"
          done > /tmp/foundation-stage/patch.b64
          base64 -d /tmp/foundation-stage/patch.b64 > /tmp/foundation-stage/patch.tar.gz
          echo "8ff793de010feb97ba0f11b58e95f985f8bad84f321b35d1f091ede7b45aa946  /tmp/foundation-stage/patch.tar.gz" | sha256sum -c -
          tar -xzf /tmp/foundation-stage/patch.tar.gz -C .
          rm -f docker-compose.yml.codex-backup-20260805
          rm -rf .foundation-staging
          rm -f .github/workflows/foundation-v03-materialize-once.yml
          rm -f .github/workflows/foundation-materialize.yml
          test "$(git hash-object src/atom-service.ts)" = "a60366c27c12dc3341d2a7d030db7950b94f6b87"
          test "$(git hash-object src/mcp-server.ts)" = "400c0f85a4967f8f4a7c3c9bd015e9d34b298531"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement Foundation MCP v0.3 improvements"
          git push origin HEAD:main
