name: Materialize Foundation MCP v0.3
on:
  workflow_dispatch:
  push:
    branches:
      - automation/foundation-v0.3-stage
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/foundation-stage
          cat .foundation-staging/part-* > /tmp/foundation-stage/patch.b64
          base64 -d /tmp/foundation-stage/patch.b64 > /tmp/foundation-stage/patch.tar.gz
          echo "8ff793de010feb97ba0f11b58e95f985f8bad84f321b35d1f091ede7b45aa946  /tmp/foundation-stage/patch.tar.gz" | sha256sum -c -
          tar -xzf /tmp/foundation-stage/patch.tar.gz -C .
          rm -f docker-compose.yml.codex-backup-20260805
          rm -rf .foundation-staging
          rm -f .github/workflows/foundation-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -f src/atom-service.ts
          test -f src/mcp-server.ts
          git commit -m "feat: implement Foundation MCP v0.3 improvements"
          git push origin HEAD:${{ github.ref_name }}
