services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    networks:
      - main
    restart: unless-stopped
    environment:
      POSTGRES_DB: foundation
      POSTGRES_USER: foundation
      POSTGRES_PASSWORD: foundation
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation -d foundation"]
      interval: 5s
      timeout: 5s
      retries: 20

  foundation-mcp:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      MCP_TRANSPORT: http
      DATABASE_URL: postgresql://foundation:foundation@db:5432/foundation
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8787:8787"
    networks:
      - main
networks:
  main:
